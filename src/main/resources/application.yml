# ========================
# 服务器配置
# ========================
server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: seckill-mall1
  # ========================
  # 数据源配置
  # ========================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&connectTimeout=5000&socketTimeout=10000&autoReconnect=true&failOverReadOnly=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      auto-commit: true
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: cjh2468
  # ========================
  # Redis配置
  # ========================
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
  # ========================
  # RabbitMQ配置
  # ========================
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${MQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  # ========================
  # Spring Cloud配置
  # ========================
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719

# ========================
# MyBatis-Plus配置
# ========================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.seckill.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
# ========================
# Redisson分布式锁配置
# ========================
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      password: null
      database: 0
      connectionPoolSize: 64
      connectionMinimumIdleSize: 24
      timeout: 3000
      connectTimeout: 10000
# ========================
#        AI调用配置
# ========================
ai:
  api:
    key: ${AI_API_KEY:}
    url: https://api.deepseek.com/chat/completions
  model: deepseek-v4-flash

# ========================
# 日志配置
# ========================
logging:
  level:
    com.seckill.mapper: ERROR
    com.baomidou.mybatisplus: WARN

  # 激活本地开发配置
  profiles:
    active: dev